<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E7BFF"/>
      <stop offset="1" stop-color="#8E4DF5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base arredondada estilo macOS -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#shine)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="198.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- tres colunas -->
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="200" y="230" width="190" height="564" rx="44"/>
    <rect x="417" y="230" width="190" height="564" rx="44"/>
    <rect x="634" y="230" width="190" height="564" rx="44"/>
  </g>

  <!-- cards -->
  <g fill="#ffffff">
    <rect x="224" y="258" width="142" height="96" rx="26"/>
    <rect x="224" y="374" width="142" height="96" rx="26"/>
    <rect x="224" y="490" width="142" height="96" rx="26"/>

    <rect x="441" y="258" width="142" height="96" rx="26"/>
    <rect x="441" y="374" width="142" height="96" rx="26"/>

    <rect x="658" y="258" width="142" height="96" rx="26" fill-opacity="0.75"/>
  </g>

  <!-- marcadores de cor das colunas -->
  <circle cx="254" cy="306" r="16" fill="#38BDF8"/>
  <circle cx="471" cy="306" r="16" fill="#FBBF24"/>
  <circle cx="688" cy="306" r="16" fill="#34D399"/>
</svg>
